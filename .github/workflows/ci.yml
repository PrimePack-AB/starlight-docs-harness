name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Smoke build against sample docs
        env:
          DOCS_DIR: ${{ github.workspace }}/tests/sample-docs/docs
          EXCLUDE_DIRS: notes
          SITE_BASE: /starlight-docs-harness
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          bun run build
          test ! -e dist/notes
          test -f dist/index.html
          test -f dist/concepts/sample-concept/index.html
          grep -q 'href="/starlight-docs-harness/guides/sample-guide/"' dist/concepts/sample-concept/index.html
          grep -q 'blob/main/fixture.json' dist/concepts/sample-concept/index.html
          grep -q 'blob/main/docs/notes/internal-note.md' dist/concepts/sample-concept/index.html
          if grep -rq 'href="\.\./' dist --include='*.html'; then echo 'relative href survived rewriting'; exit 1; fi
          if grep -rPq 'href="(?!https?://|/)[^"]*\.md"' dist --include='*.html'; then echo 'relative .md href survived rewriting'; exit 1; fi
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          docs-dir: tests/sample-docs/docs
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: github-pages
      - name: Assert artifact content
        run: |
          mkdir artifact && tar -xf github-pages/artifact.tar -C artifact
          test -f artifact/index.html
          grep -rq 'href="/starlight-docs-harness/guides/sample-guide/"' artifact
          grep -rq 'blob/main/docs/notes/internal-note.md' artifact
