name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Smoke build against sample docs
        env:
          DOCS_DIR: ${{ github.workspace }}/tests/sample-docs/docs
          EXCLUDE_DIRS: notes
          SITE_BASE: /starlight-docs-harness
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          bun run build
          test ! -e dist/notes
          test -f dist/index.html
          grep -q 'This site renders the' dist/index.html
          test -f dist/concepts/sample-concept/index.html
          grep -q 'href="/starlight-docs-harness/guides/sample-guide/"' dist/concepts/sample-concept/index.html
          grep -q 'blob/main/fixture.json' dist/concepts/sample-concept/index.html
          grep -q 'blob/main/docs/notes/internal-note.md' dist/concepts/sample-concept/index.html
          if grep -rq 'href="\.\./' dist --include='*.html'; then echo 'relative href survived rewriting'; exit 1; fi
          if grep -rPq 'href="(?!https?://|/)[^"]*\.md"' dist --include='*.html'; then echo 'relative .md href survived rewriting'; exit 1; fi
          test -f dist/favicon.svg
          grep -q 'href="/starlight-docs-harness/favicon.svg"' dist/index.html
          if grep -rqi mermaid dist/_astro; then echo 'mermaid loader bundled without mermaid fences'; exit 1; fi
      - name: Smoke build against sample docs with a root index
        env:
          DOCS_DIR: ${{ github.workspace }}/tests/sample-docs-with-index/docs
          EXCLUDE_DIRS: notes
          SITE_BASE: /starlight-docs-harness
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          bun run build
          test ! -e dist/notes
          test ! -e dist/concepts
          if grep -q 'This site renders the' dist/index.html; then echo 'bundled landing page rendered instead of the root index'; exit 1; fi
          grep -q 'Consumer-supplied landing page.' dist/index.html
          grep -q 'data-has-hero' dist/index.html
          if grep -q 'data-has-sidebar' dist/index.html; then echo 'splash template ignored'; exit 1; fi
          grep -q 'href="/starlight-docs-harness/guides/sample-guide/"' dist/index.html
          grep -q 'blob/main/fixture.json' dist/index.html
          grep -q 'blob/main/docs/notes/internal-note.md' dist/index.html
          grep -q 'href="/starlight-docs-harness/#top"' dist/guides/sample-guide/index.html
          if grep -rq 'href="\.\./' dist --include='*.html'; then echo 'relative href survived rewriting'; exit 1; fi
          if grep -rPq 'href="(?!https?://|/)[^"]*\.md"' dist --include='*.html'; then echo 'relative .md href survived rewriting'; exit 1; fi
          test -f dist/favicon.svg
          grep -q 'href="/starlight-docs-harness/favicon.svg"' dist/index.html
          if grep -rqi mermaid dist/_astro; then echo 'mermaid loader bundled without mermaid fences'; exit 1; fi
      # Copied outside the workspace so imports in the consumer's MDX cannot
      # resolve through the harness's node_modules by walking up the real path.
      - name: Smoke build against sample docs with MDX components and mermaid
        env:
          DOCS_DIR: ${{ runner.temp }}/sample-docs-mdx-mermaid/docs
          EXCLUDE_DIRS: notes
          SITE_BASE: /starlight-docs-harness
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cp -r tests/sample-docs-mdx-mermaid "$RUNNER_TEMP/"
          bun run build
          test ! -e dist/notes
          grep -q 'Consumer-supplied MDX landing page.' dist/index.html
          grep -q 'class="card-grid' dist/index.html
          grep -q 'class="sl-link-card' dist/index.html
          grep -q 'href="/starlight-docs-harness/guides/diagram-guide/"' dist/index.html
          grep -q 'href="/starlight-docs-harness/guides/plain-guide/#from-home"' dist/index.html
          page=dist/guides/diagram-guide/index.html
          grep -q '<pre class="mermaid">flowchart LR' "$page"
          grep -q 'class="expressive-code' "$page"
          grep -q 'href="/starlight-docs-harness/guides/plain-guide/#details"' "$page"
          grep -qi mermaid dist/_astro/page.*.js
          test -f dist/favicon.svg
          if grep -rq 'href="\.\./' dist --include='*.html'; then echo 'relative href survived rewriting'; exit 1; fi
          if grep -rPq 'href="(?!https?://|/)[^"]*\.md"' dist --include='*.html'; then echo 'relative .md href survived rewriting'; exit 1; fi
      - name: Smoke build against untitled sample docs
        env:
          DOCS_DIR: ${{ github.workspace }}/tests/sample-docs-untitled/docs
          EXCLUDE_DIRS: notes
          SITE_BASE: /
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          bun run build
          grep -q '<title>H1 Only Guide' dist/guides/h1-only/index.html
          grep -q '>No heading<' dist/concepts/no-heading/index.html
          grep -q '<title>Reference' dist/reference/index.html
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          docs-dir: tests/sample-docs/docs
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: github-pages
      - name: Assert artifact content
        run: |
          mkdir artifact && tar -xf github-pages/artifact.tar -C artifact
          test -f artifact/index.html
          grep -rq 'href="/starlight-docs-harness/guides/sample-guide/"' artifact
          grep -rq 'blob/main/docs/notes/internal-note.md' artifact
          test -f artifact/favicon.svg
  self-test-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: cloudflare
        continue-on-error: true
        uses: ./
        with:
          docs-dir: tests/sample-docs/docs
          deploy-target: cloudflare
      - name: Assert the deploy failed fast without a token
        run: test "${{ steps.cloudflare.outcome }}" = failure
      - name: Assert the cloudflare-mode build
        run: |
          grep -q 'https://starlight-docs-harness.pages.dev' dist/index.html
          grep -q 'href="/favicon.svg"' dist/index.html
          grep -q 'href="/guides/sample-guide/"' dist/concepts/sample-concept/index.html
      - name: Assert the pinned wrangler resolves
        run: |
          test -x node_modules/.bin/wrangler
          expected="$(bun -e 'console.log(require("./node_modules/wrangler/package.json").version)')"
          node_modules/.bin/wrangler --version | grep -qF "$expected"
